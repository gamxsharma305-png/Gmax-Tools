plugins {
    id 'com.android.application'
}
android {
    namespace 'com.gmax.tools'
    compileSdk 34
    defaultConfig {
        applicationId "com.gmax.tools"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            // Use debug keystore for signing so APK installs on phones.
            // For Play Store, replace with a real release keystore.
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
